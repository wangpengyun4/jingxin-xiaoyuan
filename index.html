<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>静心小院</title><meta name="description" content="来坐一会儿，什么都不用做。听雨、看竹、泡一杯茶，在静心小院留一段自己的时光。"><meta property="og:title" content="静心小院"><meta property="og:description" content="来坐一会儿，什么都不用做"><meta property="og:image" content="share.png"><meta name="theme-color" content="#e5e9dc"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body><div id="world" aria-label="可以拖动、缩放和点击行走的立体小院"></div><header><a href="#scene=home">静心小院<small>一方小院 · 一刻清闲</small></a><button id="about">关于</button></header><div id="weather"><span id="time-label"></span><button id="weather-toggle">晴 / 雨</button></div><section id="welcome"><div class="intro"><span>风过竹梢，日子慢慢</span><h1>静心小院</h1><p>来坐一会儿，什么都不用做</p></div><div class="welcome-bottom glass"><p>把忙碌留在门外，把此刻留给自己。</p><button class="primary" id="enter">进院坐坐 <span>↗</span></button><small>无需登录 · 即刻入座</small></div></section><section id="yard" hidden><div class="presence glass"><i></i>此刻有 <b id="people">4</b> 人和你一起静坐</div><div id="breathing" hidden><strong id="breath-text">准备好了</strong><span id="breath-count">吸 4 · 停 4 · 呼 6</span></div><div class="dock glass"><div class="caption"><span id="status">风很轻，找个地方坐坐吧。</span><time id="timer">00:00</time></div><nav><button data-tab="sit" class="active">静坐</button><button data-tab="breath">呼吸</button><button data-tab="tea">泡茶</button><button data-tab="sound">听声</button></nav><div id="sit-panel" class="panel"><h2>坐一会儿</h2><p>不赶时间，也不必想什么。</p><div class="actions"><button id="sit" class="primary">坐下</button><button id="bowl" class="secondary">敲一下 · 铜钵</button></div><small>听见声音，也听见安静。</small></div><div id="breath-panel" class="panel" hidden><h2>跟小团一起呼吸</h2><p>按自己的节奏，舒服就好。</p><div class="rounds"><span>轮数</span><button data-round="3">3</button><button data-round="5" class="selected">5</button><button data-round="10">10</button></div><button id="breath-start" class="primary full">开始呼吸</button></div><div id="tea-panel" class="panel" hidden><h2>把日子泡得暖一点</h2><p>一壶清水，一杯闲暇。</p><div class="tea-steps"><span>烧水</span><span>温杯</span><span>注水</span><span>出汤</span></div><p id="tea-message">水还未开，先听听风。</p><div class="actions"><button id="tea-self" class="primary">给自己泡茶</button><button id="tea-other" class="secondary">为他人泡一杯茶</button></div><small id="table-count"></small></div><div id="sound-panel" class="panel" hidden><h2>把自然调近一点</h2><p>声音可以叠加，轻轻听就好。</p><div id="sound-controls"></div><small>声音在设备上实时生成，戴上耳机也很好。</small></div><button id="door" class="door-link">⌑ 爸妈的健康小院 ↗</button></div></section><footer>静心小院 · 试用版</footer><dialog id="modal"><button id="close-modal" aria-label="关闭">×</button><div id="modal-content"></div><button id="modal-ok" class="primary full">知道了</button></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
